<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merge Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f3ea;
      --muted: #9b9a98;
      --panel: #171818;
      --panel-raised: #202222;
      --line: #303231;
      --youtube: #ff5b61;
      --twitch: #b897ff;
      --kick: #75d9d0;
      --lime: #c8f169;
      --cyan: #75d9d0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #101111;
      font: 15px/1.45 "Avenir Next", "Trebuchet MS", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }
    .app { position: relative; max-width: 1380px; min-height: 100vh; margin: auto; padding: 30px 34px 38px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 27px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--lime); font: 700 11px/1 "Courier New", monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 0; font: 700 clamp(38px, 6vw, 76px)/.9 Georgia, serif; letter-spacing: -.045em; }
    .tagline { max-width: 320px; margin: 0 0 3px; color: var(--muted); text-align: right; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 275px; gap: 18px; margin-top: 18px; }
    .chat-panel, .side-panel { border: 1px solid var(--line); background: rgba(23,24,24,.88); }
    .chat-panel { height: calc(100vh - 180px); min-height: 520px; max-height: 760px; display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid var(--line); border-radius: 2px; padding: 8px 12px; color: var(--muted); background: transparent; cursor: pointer; font: 700 11px "Courier New", monospace; letter-spacing: .06em; text-transform: uppercase; }
    button:hover, button.active { color: #111; border-color: var(--lime); background: var(--lime); }
    .live-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px "Courier New", monospace; text-transform: uppercase; white-space: nowrap; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .pulse.connected { background: var(--lime); box-shadow: 0 0 0 5px rgba(200,241,105,.1); }
    #messages { flex: 1; overflow: auto; padding: 4px 18px 18px; }
    .message { display: grid; grid-template-columns: 9px 78px minmax(70px, 150px) max-content 1fr; gap: 13px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.055); animation: arrive .3s ease both; }
    .bar { width: 3px; height: 20px; background: var(--muted); }
    .message.youtube .bar { background: var(--youtube); }
    .message.twitch .bar { background: var(--twitch); }
    .message.kick .bar { background: var(--kick); }
    .platform { color: var(--muted); font: 10px "Courier New", monospace; text-transform: uppercase; }
    .message.youtube .platform { color: var(--youtube); }
    .message.twitch .platform { color: var(--twitch); }
    .message.kick .platform { color: var(--kick); }
    .author { overflow: hidden; color: var(--ink); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .copy { min-width: 0; overflow-wrap: anywhere; }
    .copy .emote { width: 28px; height: 28px; margin: -7px 2px; vertical-align: middle; object-fit: contain; }
    time { color: #666967; font: 11px "Courier New", monospace; }
    .empty { display: grid; min-height: 530px; place-items: center; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); font: 22px Georgia, serif; }
    .side-panel { align-self: start; padding: 20px; }
    .side-title { margin: 0 0 22px; font: 21px Georgia, serif; }
    .stat { padding: 16px 0; border-top: 1px solid var(--line); }
    .stat-label { color: var(--muted); font: 10px "Courier New", monospace; letter-spacing: .1em; text-transform: uppercase; }
    .stat-value { margin-top: 4px; font: 34px Georgia, serif; }
    .legend { margin-top: 25px; padding-top: 18px; border-top: 1px solid var(--line); }
    .legend-row { display: flex; align-items: center; gap: 9px; margin-top: 11px; color: var(--muted); font-size: 13px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .youtube-dot { background: var(--youtube); }
    .twitch-dot { background: var(--twitch); }
    .kick-dot { background: var(--kick); }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .app { padding: 22px 16px 28px; }
      header { display: block; }
      .tagline { margin-top: 14px; text-align: left; }
      .layout { grid-template-columns: 1fr; }
      .chat-panel { height: 62vh; min-height: 420px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .message { grid-template-columns: 7px minmax(0, max-content) minmax(0, 1fr) max-content; grid-template-rows: auto auto; gap: 7px 9px; }
      .message .bar { grid-column: 1; grid-row: 1 / 3; }
      .message .platform { grid-column: 2; grid-row: 1; }
      .message .author { grid-column: 2; grid-row: 2; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
      .message time { grid-column: 4; grid-row: 1; justify-self: end; }
      .message .copy { grid-column: 3 / 5; grid-row: 2; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><div class="eyebrow">Live conversation / 01</div><h1>Merge Chat</h1></div>
      <p class="tagline">One room for every message, wherever your audience is watching.</p>
    </header>
    <section class="layout">
      <section class="chat-panel" aria-label="Merged chat messages">
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter messages">
            <button class="active" data-filter="all">All <span id="all-count">0</span></button>
            <button data-filter="youtube">YouTube <span id="youtube-count">0</span></button>
            <button data-filter="twitch">Twitch <span id="twitch-count">0</span></button>
            <button data-filter="kick">Kick <span id="kick-count">0</span></button>
          </div>
          <div class="live-state"><span class="pulse" id="pulse"></span><span id="connection">Connecting</span></div>
        </div>
        <div id="messages"><div class="empty"><div><strong>Waiting for the room to open</strong>Messages will appear here as they arrive.</div></div></div>
      </section>
      <aside class="side-panel">
        <h2 class="side-title">Room pulse</h2>
        <div class="stat"><div class="stat-label">Total messages</div><div class="stat-value" id="total-stat">0</div></div>
        <div class="stat"><div class="stat-label">Latest activity</div><div class="stat-value" id="latest-stat">--:--</div></div>
        <div class="legend"><div class="stat-label">Sources</div><div class="legend-row"><span class="legend-dot youtube-dot"></span>YouTube Live</div><div class="legend-row"><span class="legend-dot twitch-dot"></span>Twitch Chat</div><div class="legend-row"><span class="legend-dot kick-dot"></span>Kick Chat</div></div>
      </aside>
    </section>
  </main>
  <script>
    const messageList = document.querySelector('#messages');
    const counts = { all: 0, youtube: 0, twitch: 0, kick: 0 };
    let activeFilter = 'all';
    let messages = [];

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    let emotes = {};

    function renderMessage(message) {
      const content = document.createDocumentFragment();
      message.split(/(\s+)/).forEach((part) => {
        if (emotes[part]) {
          const image = document.createElement('img');
          image.className = 'emote';
          image.src = emotes[part];
          image.alt = part;
          image.title = part;
          image.loading = 'lazy';
          content.append(image);
        } else {
          content.append(document.createTextNode(part));
        }
      });
      return content;
    }

    function render(revealNewest = false) {
      const visible = messages.filter((item) => activeFilter === 'all' || item.platform === activeFilter);
      messageList.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<div><strong>No messages yet</strong>Try another source or wait for the next message.</div>';
        messageList.append(empty);
      } else {
        const fragment = document.createDocumentFragment();
        visible.forEach((item) => {
          const row = document.createElement('article');
          row.className = `message ${item.platform}`;
          row.innerHTML = `<span class="bar"></span><span class="platform">${item.platform}</span><strong class="author"></strong><time>${formatTime(item.timestamp)}</time><span class="copy"></span>`;
          row.querySelector('.author').textContent = item.author || 'Anonymous';
          row.querySelector('.copy').append(renderMessage(item.message));
          fragment.append(row);
        });
        messageList.append(fragment);
        messageList.scrollTop = messageList.scrollHeight;
        if (revealNewest && window.matchMedia('(max-width: 760px)').matches) {
          requestAnimationFrame(() => messageList.lastElementChild.scrollIntoView({ block: 'end', behavior: 'smooth' }));
        }
      }
      document.querySelector('#all-count').textContent = counts.all;
      document.querySelector('#youtube-count').textContent = counts.youtube;
      document.querySelector('#twitch-count').textContent = counts.twitch;
      document.querySelector('#kick-count').textContent = counts.kick;
      document.querySelector('#total-stat').textContent = counts.all;
      document.querySelector('#latest-stat').textContent = messages.length ? formatTime(messages[messages.length - 1].timestamp) : '--:--';
    }

    function addMessages(incoming) {
      incoming.forEach((item) => {
        messages.push(item);
        counts.all += 1;
        counts[item.platform] = (counts[item.platform] || 0) + 1;
      });
      if (messages.length > 200) messages = messages.slice(-200);
      render(true);
    }

    document.querySelectorAll('[data-filter]').forEach((button) => button.addEventListener('click', () => {
      activeFilter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach((item) => item.classList.toggle('active', item === button));
      render();
    }));

    const events = new EventSource('/events');
    fetch('/emotes').then((response) => response.json()).then((catalog) => {
      emotes = catalog;
      render();
    }).catch(() => {});
    events.onopen = () => {
      document.querySelector('#connection').textContent = 'Live connection';
      document.querySelector('#pulse').classList.add('connected');
    };
    events.onerror = () => {
      document.querySelector('#connection').textContent = 'Reconnecting';
      document.querySelector('#pulse').classList.remove('connected');
    };
    events.addEventListener('history', (event) => {
      messages = [];
      counts.all = counts.youtube = counts.twitch = counts.kick = 0;
      addMessages(JSON.parse(event.data));
    });
    events.addEventListener('message', (event) => addMessages([JSON.parse(event.data)]));
  </script>
</body>
</html>
